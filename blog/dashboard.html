<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 2rem;
            color: #414b56;
        }



        .card {
            overflow: hidden;
            box-shadow: 0px 2px 20px #d7dfe2;
            background: white;
            border-radius: 0.5rem;
            position: relative;
            width: 250px;
            margin: 1rem;
            transition: 250ms all ease-in-out;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0px 2px 40px #d7dfe2;
        }

        .banner-img {
            position: absolute;
            object-fit: cover;
            height: 14rem;
            width: 100%;
        }

        .category-tag {
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            background: red;
            padding: 0.5rem 1.3rem 0.5rem 1rem;
            text-transform: uppercase;
            position: absolute;
            z-index: 1;
            top: 1rem;
            border-radius: 0 2rem 2rem 0;
        }

        .popular {
            background: #ef257a;
        }

        .technology {
            background: #651fff;
        }

        .psychology {
            background: #e85808;
        }

        .card-body {
            margin: 15rem 1rem 1rem 1rem;
        }

        .blog-hashtag {
            font-size: 0.9rem;
            font-weight: 500;
            color: #4d97b2;
        }

        .blog-title {
            line-height: 1.5rem;
            margin: 1rem 0 0.5rem;
        }

        .blog-description {
            color: #616b74;
            font-size: 0.9rem;
        }

        .card-profile {
            display: flex;
            margin-top: 2rem;
            align-items: center;
        }

        .profile-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
        }

        .card-profile-info {
            margin-left: 1rem;
        }

        .profile-name {
            font-size: 1rem;
        }

        .profile-followers {
            color: #616b74;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>


    <p id="forName"> loading....</p>
    <button onclick="logOut()">log out</button>
    <div>
        <label for="title"> title: </label> <input id="title" type="text">
    </div>
    <div>
        <label for="description"> description: </label> <input id="description" type="text">
    </div>
    <br>
    <input id="file" type="file" value="" onchange="pickPicture()"> <br>
    <img id="previewImage" width="50px" height="50px" alt=""> <br>
    <button onclick="postBlog()">post </button>


    <div id="preview">


    </div>



</body>



</html>
<script>
    let userDatabase = JSON.parse(localStorage.getItem('userDatabaseJanuary')) || []
    let currentUserIndex = localStorage.getItem('currentUserIndex')
    console.log(currentUserIndex);

    let currentUser = userDatabase[currentUserIndex]

    if (!currentUser) {
        window.location.href = 'login.html'
    }


    forName.innerHTML = `welcome ${currentUser.username}`


    let blogPosts = currentUser.blogs

    displayBlog()
    // let users = [{} , {} , {}]
    // let index = 2
    // users[2]


    function pickPicture() {
        let myFile = document.getElementById('file').files[0]
        console.log(myFile);

        if (!file) {
            alert('please attach a file')
            return
        }

        let reader = new FileReader()
        reader.readAsDataURL(myFile)

        reader.addEventListener('load', (e) => {
            console.log(e.target.result);
            previewImage.src = e.target.result
        })


    }


    function postBlog() {
        let theTitle = title.value.trim().toLowerCase()
        let theDescription = description.value.trim()
        let theImage = previewImage.src.trim()
        console.log(theImage);


        if (!theTitle || !theDescription || !theImage) {
            alert('all fields are mandatory')
        } else if (blogPosts.find((blog) => { return blog.title === theTitle })) {
            alert('blog already exists')
        }
        else {

            let blog = {
                title: theTitle,
                description: theDescription,
                image: theImage,
                isLiked: false
            }

            blogPosts.push(blog)
            localStorage.setItem('userDatabaseJanuary', JSON.stringify(userDatabase))
            displayBlog()
        }

    }



    function displayBlog(params) {
        preview.innerHTML = ''
        blogPosts.forEach((blog, i, arr) => {
            preview.innerHTML += `<div onclick="likeBlog(${i})" class="card" style="background-color: ${blog.isLiked ? 'red' : 'white'} ;">
            <div class="card-banner">
                <p class="category-tag popular">Pizza</p>
                <img class="banner-img"
                    src='${blog.image}' alt=''>
            </div>
            <div class="card-body">
                <p class="blog-hashtag">#Food #Pizza</p>
                <h2 class="blog-title"> ${blog.title}</h2>
                <p class="blog-description">${blog.description}</p>

                <div class="card-profile">
                    <img class="profile-img"
                        src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpYJQKSoM7S75P_KMRtQHqAAIPh133CSxByw&usqp=CAU'
                        alt=''>
                    <div class="card-profile-info">
                        <h3 class="profile-name">Eleanor Pea</h3>
                        <p class="profile-followers">5.2k followers</p>
                    </div>
                </div>
            </div>
        </div>

`
        });

    }


    function likeBlog(index) {
        console.log(index);
        // if (blogPosts[index].isLiked === true) {
        //     blogPosts[index].isLiked = false
        // } else {
        //     blogPosts[index].isLiked = true
        // }

        // blogPosts[index].isLiked === true ?  blogPosts[index].isLiked = false : blogPosts[index].isLiked = true

        blogPosts[index].isLiked = !blogPosts[index].isLiked
        console.log(blogPosts);
        localStorage.setItem('userDatabaseJanuary', JSON.stringify(userDatabase))
        displayBlog()

    }

    function logOut() {
        let confirmer = confirm('are you sure?')
        if (confirmer) {
            localStorage.removeItem('currentUserIndex')
            alert('logout successful')
            window.location.href = 'login.html'
        }

    }
</script>
