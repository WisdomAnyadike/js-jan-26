<script>
    let database =  JSON.parse(localStorage.getItem('Todos'))  || []
    let userOutput = document.getElementById('preview')
    let userInput = document.getElementById('inputTodo')

    displayTodos()


    function displayList() {
        if (userInput.value.trim() === '') {
            alert('Input cannot be empty')
        } else {

            database.push(userInput.value) // 'eat'
          saveAndDisplayTodos()
               userInput.value = ''
            console.log(database);
        }
    }
    //[ eat,  jump , sleep ]
    function deleteTodo(i) {
        // alert(`you clicked on delete , for index ${i}`)
        let confirmDelete = confirm('are you sure')
        if (confirmDelete === true) {
            database.splice(i, 1)
           saveAndDisplayTodos()
        }

    }

    let arr = [4, 6, 7, '8']
    arr.splice(3, 1)


    function displayTodos() {
        userOutput.innerHTML = ''
        for (let index = 0; index < database.length; index++) {
            userOutput.innerHTML += `<p> ${database[index]} <button onclick="deleteTodo(${index})"> x </button> <button onclick="editTodo(${index})"> edit </button></p>`
        }
    }


    function editTodo(int) {
        let promptValue = prompt('edit todo', database[int]) //eat rice
        if (promptValue !== null && promptValue.trim() !== '') {
            database.splice(int, 1, promptValue)
             saveAndDisplayTodos()
        }
    }


       function saveAndDisplayTodos(params) {
          localStorage.setItem('Todos' , JSON.stringify(database))
            displayTodos()
    }
