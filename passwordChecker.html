<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input id="myInput" type="password"> <button id="buttonTg" onclick="changeType()"> show </button>

</body>

</html>
<script>

    let inputElement = document.getElementById('myInput')
    let buttonElement = document.getElementById('buttonTg')

    function changeType(params) {
        inputElement.type === 'password' ? buttonElement.innerHTML = 'hide' : buttonElement.innerHTML = 'show'
        inputElement.type === 'password' ? inputElement.type = 'text' : inputElement.type = 'password'
    }




</script>
