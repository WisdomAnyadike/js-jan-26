<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <input type="text" id="input"> <button onclick="decrease()"> decrease </button>

</body>

</html>
<script>
    let input = document.getElementById('input')


    function decrease(params) {
        // let inputValue = input.value //6
        // inputValue--
        // input.value = inputValue

        let decreases = setInterval(() => {
            if (+input.value === 0) {
                alert('time up')
                clearInterval(decreases)
                return
            }

            input.value--
        }, 1000);



    }


</script>
