<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input id="number" type="text"> <button onclick="showTable()"> click </button>
    <div id="preview">

    </div>

</body>

</html>
<script>


    function showTable() { 
        let numberValue = number.value //12
        for (let index = 0; index < 13; index++) {
            preview.innerHTML += `<p> ${numberValue} * ${index} = ${numberValue * index} </p>`
        }
    }



</script>
